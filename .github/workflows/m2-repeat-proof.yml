# TEMPORARY (marketing plan Q27, M2, 2026-11-05). Proves the changed test in
# CI's Linux Chromium: hero-replay-motion.spec.ts "reduced motion stops the sweep
# and does not draw the accent", 20 repeats, no retries, must be 100%
# (3 viewports x 20 = 60 of 60). Runs only on pushes to
# test/m2-hero-motion-font, and is deleted in the next commit, before this PR merges.
name: M2 repeat proof

on:
  push:
    branches: ['test/m2-hero-motion-font']

permissions:
  contents: read

jobs:
  repeat:
    name: hero reduced-motion test x20 (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with e2e fixture routes
        run: npm run build
        env:
          E2E_FIXTURES: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: The changed test, 20 repeats, no retries
        run: npx playwright test tests/e2e/hero-replay-motion.spec.ts --project=chromium --grep "reduced motion stops the sweep and does not draw the accent" --repeat-each=20 --retries=0 --reporter=list
        env:
          E2E_FIXTURES: '1'
