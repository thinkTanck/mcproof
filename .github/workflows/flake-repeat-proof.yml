# TEMPORARY (owner rulings FLAKE FIX FIRST, FLAKE FIX 2 and FLAKE FIX 3, 2026-10-21 and 22). Proves the /about and replay-follow motion
# specs in CI's Linux browsers: replay-scroll-follow.spec.ts (the about and legend proofs on this branch stand), 20 repeats, no retries, Chromium,
# phone WebKit and desktop WebKit, must be 100%. Runs only on pushes to fix/flake-fix-first, and is
# deleted in the next commit, before this PR merges.
name: Flake repeat proof

on:
  push:
    branches: ['fix/flake-fix-first']

permissions:
  contents: read

jobs:
  repeat:
    name: replay-scroll-follow x20 (Chromium, phone WebKit, desktop WebKit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with e2e fixture routes
        run: npm run build
        env:
          E2E_FIXTURES: '1'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: replay-scroll-follow, 20 repeats, no retries
        run: npx playwright test tests/e2e/replay-scroll-follow.spec.ts --project=chromium --project=webkit --project=webkit-desktop --repeat-each=20 --retries=0 --reporter=list
        env:
          E2E_FIXTURES: '1'
