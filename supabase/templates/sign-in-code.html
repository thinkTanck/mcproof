<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Your MCProof sign-in code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f2f4f7; -webkit-text-size-adjust: 100%">
    <div
      style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all; font-size: 1px; line-height: 1px; color: #f2f4f7"
    >
      Your MCProof sign-in code
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="width: 100%; background-color: #f2f4f7"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 100%; max-width: 600px; background-color: #ffffff; border: 1px solid #d9dee5; border-radius: 12px; border-collapse: separate; overflow: hidden"
          >
            <tr>
              <td
                align="left"
                style="background-color: #05080b; padding: 16px 18px; border-radius: 11px 11px 0 0"
              >
                <img
                  src="https://mcproof.dev/email/mcproof-logo.png"
                  alt="MCProof"
                  width="166"
                  height="46"
                  style="display: block; width: 166px; height: 46px; border: 0; outline: none; text-decoration: none"
                />
              </td>
            </tr>
            <tr>
              <td
                style="padding: 32px 28px 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1b2430; font-size: 16px; line-height: 24px"
              >
                <p style="margin: 0 0 16px">Hi,</p>
                <p style="margin: 0 0 24px">Use the code below to sign in to MCProof.</p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%"
                >
                  <tr>
                    <td
                      align="center"
                      style="background-color: #eef2f6; border: 1px solid #d9dee5; border-radius: 8px; padding: 20px 12px; font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: 8px; color: #0b1220"
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 8px">This code expires in 15 minutes.</p>
                <p style="margin: 0 0 24px">
                  If you did not request this code, you can ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="padding: 20px 28px 28px; border-top: 1px solid #e4e8ee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #4a5462; font-size: 13px; line-height: 20px"
              >
                <p style="margin: 0 0 4px">
                  MCProof ·
                  <a href="https://mcproof.dev" style="color: #4a5462; text-decoration: underline"
                    >mcproof.dev</a
                  >
                </p>
                <p style="margin: 0">
                  You received this because someone entered this address on mcproof.dev.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
